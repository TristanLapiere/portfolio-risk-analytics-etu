[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "portfolio-risk-analytics"
version = "0.1.0"
description = "Educational portfolio risk analytics dashboard"
requires-python = ">=3.9"
dependencies = [
    "pandas>=2.0",
    "streamlit>=1.49",
]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
